<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tissage du réseau Civipédia</title>
<link rel="icon" href="logo-civipedia.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap">
<style>
/* Charte Civipédia : noir nuit, jaune Civipédia, bleu. Bandeau d'en-tête avec le logo, une grande carte lumineuse
   (France et Belgique en encart), chiffres et légende en bande sous la carte. Thème sombre unique, choisi. */
:root{
  --night:#05080f; --night-2:#0a1120; --panel:#0d1628; --line:#1a2740; --line-2:#26385c;
  --ink:#f2f5fa; --ink-2:#b4c0d4; --ink-3:#7686a1;
  --yellow:#ffd21f; --yellow-2:#ffe46b; --blue:#2f6bff; --blue-2:#79a4ff; --white:#eef3ff;
  --sea:#04070d; --land:#0d1a33; --border:rgba(90,140,255,.28);
  --c-projet:var(--yellow); --c-evenement:var(--blue); --c-organisation:var(--blue-2); --c-personne:var(--white);
  --f-title:"Montserrat","Segoe UI",system-ui,sans-serif;
  --f-sans:"Inter","Segoe UI",system-ui,sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--f-sans);font-size:15px;line-height:1.5;margin:0}
.topbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:linear-gradient(180deg,#070c17,var(--night))}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.logo{width:46px;height:auto;flex:none;display:block;border-radius:4px}
.word{font:900 26px/1 var(--f-title);letter-spacing:.02em;color:var(--yellow)}
.tag{border-left:1px solid var(--line-2);padding-left:14px;font-size:12.5px;line-height:1.35;color:var(--ink-2)}
.proto{margin-left:auto;font:700 11px var(--f-title);letter-spacing:.14em;text-transform:uppercase;color:var(--night);background:var(--yellow);border-radius:999px;padding:6px 12px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding:22px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
header.title{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 28px}
h1{font:800 clamp(1.9rem,4.2vw,2.9rem)/1.05 var(--f-title);margin:0;letter-spacing:-.01em;text-transform:uppercase}
h1 span{color:var(--yellow)}
.rule{width:56px;height:4px;background:var(--yellow);border-radius:2px;margin-top:12px}
.lede{margin:0;color:var(--ink-2);font-size:1.03rem;max-width:46ch}
.mapbox{position:relative;background:var(--sea);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background-image:radial-gradient(ellipse at 62% 30%,rgba(47,107,255,.14),transparent 55%),radial-gradient(ellipse at 20% 80%,rgba(255,210,31,.06),transparent 50%)}
#map{display:block;width:100%;height:auto}
.band{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px 28px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);background:rgba(10,17,32,.92)}
.figs{display:flex;flex-wrap:wrap;gap:8px 28px}
.figs div{display:flex;align-items:baseline;gap:8px}
.figs b{font:800 1.7rem/1 var(--f-title);color:var(--yellow);font-variant-numeric:tabular-nums}
.figs span{font-size:.86rem;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:20px;height:0;border-top:2px solid;vertical-align:middle;margin-right:7px;border-radius:2px;box-shadow:0 0 6px currentColor}
.k-projet{border-color:var(--c-projet)!important;color:var(--c-projet)} .k-evenement{border-color:var(--c-evenement)!important;color:var(--c-evenement)}
.k-organisation{border-color:var(--c-organisation)!important;color:var(--c-organisation)} .k-personne{border-color:var(--c-personne)!important;color:var(--c-personne)}
.countries{font-size:.92rem;color:var(--ink-2)}
.countries b{color:var(--ink);font-weight:600}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--ink-3);border-top:1px solid var(--line);padding-top:14px}
footer b{font:800 .8rem var(--f-title);letter-spacing:.08em;color:var(--ink)}
footer b span{color:var(--yellow)}
/* Carte */
.country{fill:var(--land);stroke:var(--border);stroke-width:.6}
.thread{fill:none;stroke-linecap:round;opacity:.9}
.thread.glow{opacity:.35;filter:url(#flou)}
.thread.projet{stroke:var(--c-projet)} .thread.evenement{stroke:var(--c-evenement)}
.thread.organisation{stroke:var(--c-organisation)} .thread.personne{stroke:var(--c-personne)}
.zone{fill:var(--yellow);fill-opacity:.06;stroke:var(--yellow);stroke-opacity:.45;stroke-dasharray:3 5}
.pt{fill:var(--yellow-2);stroke:var(--night);stroke-width:.8}
.pt.hub{fill:var(--yellow);stroke:var(--night);stroke-width:1.2}
.halo{fill:url(#halo);pointer-events:none}
.ring{fill:none;stroke:var(--yellow);stroke-width:1.2;opacity:.75}
.lbl{font:600 12px var(--f-sans);fill:var(--white);paint-order:stroke;stroke:var(--sea);stroke-width:3.5px;stroke-linejoin:round}
.lbl.hub{fill:var(--yellow);font-weight:700}
.lbl.big{font:700 15px var(--f-title)}
.inset-frame{fill:rgba(4,7,13,.92);stroke:var(--line-2);stroke-width:1}
.inset-title{font:700 11px var(--f-title);letter-spacing:.14em;fill:var(--yellow);text-transform:uppercase}
.focus{fill:none;stroke:var(--yellow);stroke-opacity:.5;stroke-width:1;stroke-dasharray:3 3}
.connector{stroke:var(--yellow);stroke-opacity:.35;stroke-width:1;stroke-dasharray:3 3}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <img class="logo" src="logo-civipedia.svg" alt="Civipedia">
    <div class="word">CIVIPEDIA</div>
    <div class="tag">Des territoires<br>plus ouverts,<br>plus coopératifs</div>
  </div>
  <div class="proto">Prototype</div>
</div>
<div class="wrap">
  <header class="title">
    <div>
      <h1>Le tissage du <span>réseau</span></h1>
      <div class="rule"></div>
    </div>
    <p class="lede">Les lieux où Civipédia agit et les liens qui les relient, en France et à l'international.</p>
  </header>

  <div class="mapbox">
    <svg id="map" viewBox="0 0 1200 680" role="img" aria-label="Carte du réseau Civipédia"></svg>
    <div class="band">
      <div class="figs" id="figs"></div>
      <div class="legend">
        <span><i class="k-projet"></i>Démarches</span>
        <span><i class="k-evenement"></i>Événements</span>
        <span><i class="k-organisation"></i>Partenaires</span>
        <span><i class="k-personne"></i>Personnes</span>
      </div>
    </div>
  </div>
  <div class="countries" id="countries"></div>
  <footer><b>COMPRENDRE. STRUCTURER. COOPÉRER. <span>TRANSFORMER.</span></b><span id="foot"></span></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<script>
/* Trois sources, dans l'ordre :
 * 1. ouverte par le script Google de l'accès réservé (technique/reseau-apps-script), la page reçoit à la place du
 *    repère ci-dessous « const R = {...}; », calculé en direct depuis la grande base ;
 * 2. ouverte directement, elle lit la version publique en direct (adresse « api » de config.json) : noms de lieux,
 *    comptes et liens, sans aucun nom ni identifiant ;
 * 3. si le script ne répond pas, elle affiche l'instantané donnees.json. */
/*__DONNEES__*/
const R_DIRECT = typeof R !== "undefined" ? R : null;
(async function(){
const $ = id => document.getElementById(id);
let R = R_DIRECT;
// Version publique en direct : l'adresse publique du script Google, réglée dans config.json.
if (!R) {
  try {
    const conf = await fetch("config.json", { cache: "no-store" }).then(r => r.json());
    if (conf.api) {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 12000);
      const d = await fetch(conf.api + (conf.api.includes("?") ? "&" : "?") + "format=public", { signal: ctl.signal }).then(r => r.json());
      clearTimeout(t);
      if (d && Array.isArray(d.places) && d.places.length) R = d;
    }
  } catch (e) { /* script injoignable : on garde l'instantané */ }
}
// Secours : l'instantané publié dans le dépôt.
if (!R) {
  try { R = await fetch("donnees.json").then(r => r.json()); }
  catch (e) {
    document.querySelector(".mapbox").innerHTML = '<p style="padding:32px;margin:0;color:var(--ink-2)">Les données de la carte n’ont pas pu être chargées.</p>';
    return;
  }
}
const MONDE = await fetch("monde.json").then(r => r.json());
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const P = Object.fromEntries(R.places.map(p => [p.id, p]));
const weight = p => p.n ? p.n.organisations + p.n.projets + p.n.evenements + p.n.personnes + p.n.territoires : 0;
const DECL = Object.fromEntries(R.declare.map(d => [d.id, d]));
const node = id => P[id] || DECL[id];
const THREADS = R.edges.concat(R.hub ? R.declare.map(d => ({ a: R.hub, b: d.id, cat: "organisation" })) : []);
const nb = k => R.places.reduce((s, p) => s + p.n[k], 0);
const PAYS = { FR: "France", BE: "Belgique", CA: "Canada", CD: "République démocratique du Congo" };
const pays = [...new Set(R.places.map(p => p.pays))];
const zones = R.declare.filter(d => d.zone).map(d => d.nom);

/* ---------- Chiffres ---------- */
$("figs").innerHTML = [
  [R.places.length, "lieux"],
  [THREADS.length, "liens"],
  [pays.length + zones.length, "pays et zones"],
  [nb("organisations"), "organisations"],
  [nb("projets"), "démarches"],
].map(([v, l]) => `<div><b>${v}</b><span>${esc(l)}</span></div>`).join("");
$("countries").innerHTML = "Présent en " + pays.sort((a, b) => a === "FR" ? -1 : b === "FR" ? 1 : 0)
  .map(c => `<b>${esc(PAYS[c] || c)}</b>`).concat(zones.map(z => `<b>${esc(z)}</b>`)).join(", ").replace(/, ([^,]*)$/, " et $1") + ".";
const jour = R.genere_le.split("-").reverse().join("/");
$("foot").textContent = R.instantane
  ? `Prototype. Instantané de la base Civipédia au ${jour}.`
  : `Prototype. Calculé en direct depuis la base Civipédia, le ${jour}.`;

/* ---------- Géométrie ---------- */
const W = 1200, H = 680;
const svg = d3.select("#map");
const defs = svg.append("defs");
const hg = defs.append("radialGradient").attr("id", "halo");
hg.append("stop").attr("offset", "0%").attr("stop-color", "#ffd21f").attr("stop-opacity", .55);
hg.append("stop").attr("offset", "45%").attr("stop-color", "#ffd21f").attr("stop-opacity", .16);
hg.append("stop").attr("offset", "100%").attr("stop-color", "#ffd21f").attr("stop-opacity", 0);
defs.append("filter").attr("id", "flou").attr("x", "-20%").attr("y", "-20%").attr("width", "140%").attr("height", "140%")
  .append("feGaussianBlur").attr("stdDeviation", 2.2);
// Fil lumineux : un trait flou dessous, un trait fin dessus.
function fil(g, t, d, w){
  g.append("path").attr("class", "thread glow " + t.cat).attr("stroke-width", w * 3.2).attr("d", d);
  g.append("path").attr("class", "thread " + t.cat).attr("stroke-width", w).attr("d", d);
}
// Point lumineux : un halo, puis le point.
function point(g, x, y, r, n, hub){
  g.append("circle").attr("class", "halo").attr("cx", x).attr("cy", y).attr("r", r * (hub ? 5.5 : 3.6));
  if (hub) g.append("circle").attr("class", "ring").attr("cx", x).attr("cy", y).attr("r", r * 2.1);
  g.append("circle").attr("class", "pt" + (hub ? " hub" : "")).attr("cx", x).attr("cy", y).attr("r", r).append("title").text(n.nom);
}
const FR_BOX = [[-5.3, 42.2], [8.3, 51.3]];      // encart France et Belgique
const IN = { x: 24, y: 300, w: 470, h: 356 };
const inFrance = ll => ll[1] >= FR_BOX[0][0] - .5 && ll[1] <= FR_BOX[1][0] + .5 && ll[0] >= FR_BOX[0][1] - .5 && ll[0] <= FR_BOX[1][1] + .5;
// Le cadre du monde s'ajuste aux lieux réels du réseau (France incluse).
const all = R.places.concat(R.declare).map(n => [n.ll[1], n.ll[0]]).concat([[-5.3, 42.2], [8.3, 51.3]]);
const proj = d3.geoMercator().fitExtent([[60, 40], [W - 60, H - 40]], { type: "MultiPoint", coordinates: all });
const projIn = d3.geoMercator().fitExtent([[IN.x + 14, IN.y + 30], [IN.x + IN.w - 14, IN.y + IN.h - 12]], { type: "MultiPoint", coordinates: FR_BOX });
const at = (pr, ll) => pr([ll[1], ll[0]]);
function arc(a, b, bend = .16){
  const [x1, y1] = a, [x2, y2] = b, dx = x2 - x1, dy = y2 - y1;
  return `M${x1},${y1} Q${(x1 + x2) / 2 - dy * bend},${(y1 + y2) / 2 + dx * bend} ${x2},${y2}`;
}
const rr = d3.scaleSqrt().domain([1, d3.max(R.places, weight) || 1]).range([2.2, 6.5]);
const radius = n => n.id === R.hub ? 6.5 : DECL[n.id] ? 4 : rr(Math.max(1, weight(n)));
const name = n => n.id === R.hub ? n.nom + " · siège" : n.nom.replace(/\s*\(.*\)$/, "");
// Noms : les lieux les plus importants d'abord, sans chevauchement.
function labels(g, pr, list, minW, size){
  const placed = [];
  list.slice().sort((a, b) => (b.id === R.hub) - (a.id === R.hub) || (DECL[b.id] ? 99 : weight(b)) - (DECL[a.id] ? 99 : weight(a))).forEach(n => {
    if (n.id !== R.hub && !DECL[n.id] && weight(n) < minW) return;
    const [x, y] = at(pr, n.ll), txt = name(n), w = txt.length * size * .55, r = radius(n);
    const left = x + r + 5 + w > (pr === projIn ? IN.x + IN.w - 6 : W - 10);
    const box = { x0: left ? x - r - 5 - w : x + r + 5, y0: y - size, x1: left ? x - r - 5 : x + r + 5 + w, y1: y + 4 };
    if (placed.some(b => !(box.x1 < b.x0 || box.x0 > b.x1 || box.y1 < b.y0 || box.y0 > b.y1))) return;
    placed.push(box);
    g.append("text").attr("class", "lbl" + (n.id === R.hub ? " hub" : "") + (pr === proj ? " big" : ""))
      .attr("x", left ? x - r - 5 : x + r + 5).attr("y", y + 4).attr("text-anchor", left ? "end" : "start").text(txt);
  });
}

/* ---------- Monde ---------- */
const world = svg.append("g");
world.selectAll("path").data(MONDE.features).join("path").attr("class", "country").attr("d", d3.geoPath(proj));
R.declare.filter(d => d.zone).forEach(d => {
  const [x, y] = at(proj, d.ll);
  world.append("ellipse").attr("class", "zone").attr("cx", x).attr("cy", y).attr("rx", 105).attr("ry", 58);
});
THREADS.filter(t => !inFrance(node(t.a).ll) || !inFrance(node(t.b).ll)).forEach(t => {
  fil(world, t, arc(at(proj, node(t.a).ll), at(proj, node(t.b).ll), .14), 1.4);
});
const f0 = proj(FR_BOX[0]), f1 = proj(FR_BOX[1]);
const fx = Math.min(f0[0], f1[0]) - 4, fy = Math.min(f0[1], f1[1]) - 4, fw = Math.abs(f1[0] - f0[0]) + 8, fh = Math.abs(f1[1] - f0[1]) + 8;
world.append("rect").attr("class", "focus").attr("x", fx).attr("y", fy).attr("width", fw).attr("height", fh).attr("rx", 3);
world.append("line").attr("class", "connector").attr("x1", fx).attr("y1", fy + fh).attr("x2", IN.x + IN.w).attr("y2", IN.y);
if (R.hub) { const h = at(proj, node(R.hub).ll); point(world, h[0], h[1], 4.5, node(R.hub), true); }
const dehors = R.places.concat(R.declare).filter(n => !inFrance(n.ll));
dehors.forEach(n => {
  const [x, y] = at(proj, n.ll);
  point(world, x, y, DECL[n.id] ? 4 : 3.5, n, false);
});
labels(world, proj, dehors, 0, 14);

/* ---------- Encart France et Belgique ---------- */
const inset = svg.append("g");
inset.append("rect").attr("class", "inset-frame").attr("x", IN.x).attr("y", IN.y).attr("width", IN.w).attr("height", IN.h).attr("rx", 6);
inset.append("clipPath").attr("id", "clipIn").append("rect").attr("x", IN.x).attr("y", IN.y).attr("width", IN.w).attr("height", IN.h).attr("rx", 6);
const ig = inset.append("g").attr("clip-path", "url(#clipIn)");
ig.selectAll("path").data(MONDE.features).join("path").attr("class", "country").attr("d", d3.geoPath(projIn));
THREADS.filter(t => inFrance(node(t.a).ll) && inFrance(node(t.b).ll)).forEach(t => {
  fil(ig, t, arc(at(projIn, node(t.a).ll), at(projIn, node(t.b).ll)), 1.1);
});
const dedans = R.places.concat(R.declare).filter(n => inFrance(n.ll)).sort((a, b) => (a.id === R.hub) - (b.id === R.hub));
dedans.forEach(n => {
  const [x, y] = at(projIn, n.ll);
  point(ig, x, y, radius(n), n, n.id === R.hub);
});
labels(ig, projIn, dedans, 5, 12);
inset.append("text").attr("class", "inset-title").attr("x", IN.x + 16).attr("y", IN.y + 22).text("France et Belgique");
})();
</script>
</body>
</html>
