<style>
/* Mise en page : un « dossier d'orientation » sur une seule colonne ; le questionnaire avance une question à la fois,
   la restitution se lit comme un rapport, de la synthèse vers le détail.
   Charte Couleur Talents : violet profond (repères, radar), jaune safran (bandeau, appel à l'action), orange et magenta (accents de la fleur). */
:root {
  --paper: #FBF9F6; --surface: #FFFFFF; --ink: #24152C; --muted: #6A5C70; --line: #E7DFE9;
  --accent: #5B1F7A; --accent-ink: #4A1764; --accent-soft: #F1E8F5; --on-accent: #FFFFFF;
  --saffron: #F3BD3E; --on-saffron: #3D1252; --orange: #E2691D; --magenta: #D23A8E;
  --warm: #B4500F; --warm-soft: #FCEBDD; --good: #2F7A4E; --good-soft: #E3F2E8;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --radius: 12px; --measure: 68ch;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #18111D; --surface: #221829; --ink: #F3ECF5; --muted: #B3A5B9; --line: #3A2C42;
  --accent: #C79BE0; --accent-ink: #DDBDF0; --accent-soft: #33223D; --on-accent: #24102F;
  --saffron: #F3BD3E; --on-saffron: #3D1252; --orange: #F08A4B; --magenta: #EB6AAE;
  --warm: #F2A060; --warm-soft: #3A2414; --good: #72C995; --good-soft: #17301F; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #18111D; --surface: #221829; --ink: #F3ECF5; --muted: #B3A5B9; --line: #3A2C42;
  --accent: #C79BE0; --accent-ink: #DDBDF0; --accent-soft: #33223D; --on-accent: #24102F;
  --saffron: #F3BD3E; --on-saffron: #3D1252; --orange: #F08A4B; --magenta: #EB6AAE;
  --warm: #F2A060; --warm-soft: #3A2414; --good: #72C995; --good-soft: #17301F; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6; margin: 0; }
.brandrule { height: 6px; background: linear-gradient(90deg, var(--saffron) 0 40%, var(--orange) 40% 60%, var(--magenta) 60% 78%, var(--accent) 78% 100%); }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 56px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 4.4vw, 2.9rem); font-weight: 700; letter-spacing: -0.01em; line-height: 1.1; }
h2 { font-size: 1.4rem; font-weight: 600; }
h3 { font-size: 1.08rem; font-weight: 600; }
p { margin: 0; max-width: var(--measure); }
.eyebrow { font-family: var(--font-display); font-size: 0.82rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--warm); }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button, .btn { font: inherit; cursor: pointer; border-radius: var(--radius); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--on-accent); font-family: var(--font-display); font-weight: 600; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--accent-ink); border-color: var(--line); }
.btn:hover { filter: brightness(1.06); }
.btn.ghost:hover { border-color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; }

/* Accueil */
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; align-items: center; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; }
.facts li { border-top: 3px solid var(--saffron); padding-top: 8px; }
.facts b { display: block; font-family: var(--font-display); font-size: 1.35rem; }
.notice { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 16px 18px; }
.example-fig { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.example-fig figcaption { font-size: 0.82rem; color: var(--muted); text-align: center; }

/* Questionnaire */
.progress { display: grid; gap: 4px; }
.segs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.seg { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.seg i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px 24px; display: flex; flex-direction: column; gap: 20px; }
.qtext:focus { outline: none; }
.qtext { font-family: var(--font-display); font-size: 1.32rem; font-weight: 500; line-height: 1.35; max-width: 40ch; }
.opts { display: grid; gap: 10px; }
.opts.likert { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.opt { text-align: left; background: var(--paper); color: var(--ink); border: 1.5px solid var(--line); padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; line-height: 1.4; }
.opt:hover { border-color: var(--accent); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt .key { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; font-size: 0.8rem; font-weight: 700; color: var(--accent-ink); }
.likert .opt { flex-direction: column; align-items: center; text-align: center; font-size: 0.9rem; padding: 14px 8px; }
textarea { font: inherit; width: 100%; min-height: 130px; padding: 12px; border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); }
.qnav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Restitution */
.report { display: flex; flex-direction: column; gap: 44px; }
.rhead { display: flex; flex-direction: column; gap: 14px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.badge { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; font-size: 0.86rem; font-weight: 700; }
.badge::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.badge.RC { background: var(--good-soft); color: var(--good); }
.badge.MC { background: var(--accent-soft); color: var(--accent-ink); }
.badge.EX { background: var(--warm-soft); color: var(--warm); }
.toc { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.9rem; }
.toc a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
.toc a:hover { color: var(--accent-ink); border-color: var(--accent); }
section.block { display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 16px; }
.synth { font-size: 1.12rem; line-height: 1.65; display: flex; flex-direction: column; gap: 10px; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.tabs button { border: 0; border-radius: 0; background: var(--surface); color: var(--muted); padding: 8px 14px; font-size: 0.9rem; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.sig { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: center; }
.radar-box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
.radar-box svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-direction: column; gap: 8px; font-size: 0.88rem; color: var(--muted); }
.legend span { display: inline-flex; gap: 8px; align-items: center; }
.bars { display: flex; flex-direction: column; gap: 14px; }
.bipolar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1fr); gap: 10px; align-items: center; font-size: 0.85rem; }
.bipolar .pl { color: var(--muted); text-align: right; }
.bipolar .pr { color: var(--muted); }
.track { position: relative; height: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
.track .mark40, .track .mark60 { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.track .mark40 { left: 40%; } .track .mark60 { left: 60%; }
.track .dot { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.track .dot.lim { background: var(--surface); border: 2px dashed var(--accent); }
.bipolar .name { grid-column: 1 / -1; font-weight: 700; font-size: 0.95rem; display: flex; justify-content: space-between; gap: 8px; }
.charlist { display: grid; gap: 12px; }
.char { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 8px; }
.char header { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.score { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; }
.meter { height: 6px; background: var(--paper); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.tag { display: inline-block; font-size: 0.78rem; padding: 2px 8px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); }
.tag.lim { color: var(--warm); border-color: var(--warm); background: var(--warm-soft); }
details summary { cursor: pointer; color: var(--accent-ink); font-size: 0.9rem; }
details ul { margin: 8px 0 0; padding-left: 18px; font-size: 0.9rem; color: var(--muted); display: grid; gap: 4px; }
.subhead { font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; color: var(--muted); margin-top: 6px; }
.fam { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 12px; }
.fam .top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.fam .big { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
.fam .big small { font-size: 0.9rem; color: var(--muted); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.85rem; padding: 3px 10px; border-radius: 999px; background: var(--good-soft); color: var(--good); }
.chip.neg { background: var(--warm-soft); color: var(--warm); }
.note { font-size: 0.84rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }
.kv { display: grid; grid-template-columns: minmax(0, 9rem) minmax(0, 1fr); gap: 4px 14px; font-size: 0.92rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.alllist { display: grid; gap: 6px; }
.allrow { display: grid; grid-template-columns: minmax(0, 1fr) 7rem 3rem; gap: 10px; align-items: center; font-size: 0.9rem; }
.allrow .num { text-align: right; font-variant-numeric: tabular-nums; }
.card-list { display: grid; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 6px; }
.item.tension { border-color: var(--orange); }
.item .q { font-style: italic; color: var(--muted); font-size: 0.92rem; }
.conf { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; }
.indic { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.indic div { border-top: 1px solid var(--line); padding-top: 6px; font-size: 0.82rem; color: var(--muted); }
.indic b { display: block; font-family: var(--font-display); font-size: 1.15rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.cta { background: var(--saffron); color: var(--on-saffron); border-radius: 14px; padding: 24px; display: grid; gap: 12px; }
.cta p { color: inherit; }
.cta .btn { background: #5B1F7A; color: #FFFFFF; border-color: #5B1F7A; }
.cta .btn.ghost { background: transparent; color: var(--on-saffron); border-color: var(--on-saffron); }
.cta .contact { font-size: 0.92rem; user-select: all; }
.empty { color: var(--muted); font-style: italic; }
.loading { min-height: 50vh; display: grid; place-items: center; text-align: center; }
.foot a { color: inherit; }
.foot { font-size: 0.82rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 6px; }

@media (max-width: 720px) {
  body { font-size: 16px; }
  .wrap { padding-inline: 16px; }
  .hero, .sig { grid-template-columns: minmax(0, 1fr); }
  .facts { grid-template-columns: minmax(0, 1fr); }
  .opts.likert { grid-template-columns: minmax(0, 1fr); }
  .likert .opt { flex-direction: row; text-align: left; }
  .indic { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bipolar { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .bipolar .track { grid-column: 1 / -1; grid-row: 2; }
  .bipolar .pl { text-align: left; }
  .bipolar .pr { text-align: right; }
  .allrow { grid-template-columns: minmax(0, 1fr) 3rem; }
  .allrow .meter { display: none; }
  .qcard { padding: 20px 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>/* Moteur de calcul — reproduit les formules du classeur (règles R-SC, R-NIV, R-CONF, R-CORR, T-xx, R-QUAL, R-INC, R-TIT, R-APP, R-VIG, R-SYN).

      return { id: q[0], texte: q[1], bloc: q[2], type: q[3], dim: q[4], dim2: q[5], sens: q[6], coef: q[7], oblig: q[8], inv: q[9], sens2: q[10], coef2: q[11] };

      var x = REF.modalites[q.type][String(a)];
      if (x === undefined) return;
      if (q.oblig) nbObligRep++;

      var flip = (q.inv ? 1 : 0) ^ (q.sens === -1 ? 1 : 0);
      var xo = flip ? 1 - x : x;
      items[q.dim].push({ q: q.id, x: xo, coef: q.coef, brut: String(a) });
      if (q.dim2) {
        var flip2 = (q.inv ? 1 : 0) ^ (q.sens2 === -1 ? 1 : 0);
        sec[q.dim2].push({ q: q.id, x: flip2 ? 1 - x : x, coef: q.coef2 });
      }
    });

    // 2. Scores par dimension (R-SC-04, R-NIV-01, R-CONF-01/02)
    var scores = {};

      var d = D[id];

      });

        compatibilite: comp, niveau: comp >= C.SEUIL_COMPAT_ELEVEE ? "Relativement élevée" : (comp >= C.SEUIL_COMPAT_MODEREE ? "Modérée" : "Faible"),

    });
    familles.forEach(function (f) { f.rang = 1 + familles.filter(function (g) { return g.compatibilite > f.compatibilite; }).length; });
    var famTri = familles.slice().sort(function (a, b) { return a.rang - b.rang || REF.familles.findIndex(function (x) { return x[0] === a.famille_id; }) - REF.familles.findIndex(function (x) { return x[0] === b.famille_id; }); });

    var tensions = REF.tensions.filter(function (t) { return test(scores[t[1]].score, t[2], t[3]) && test(scores[t[4]].score, t[5], t[6]); })
      .map(function (t) { return { regle_id: t[0], dimensions: [t[1], t[4]], scores: [scores[t[1]].score, scores[t[4]].score], message: t[7], question_adaptative: t[8] || null }; });

    var completude = nbOblig ? nbObligRep / nbOblig : 0;
    var nonSuff = dimOrder.filter(function (id) { return scores[id].confiance !== "Suffisante"; });
    var mean = function (a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : 0; };

    var comps = familles.map(function (f) { return f.compatibilite; }).sort(function (a, b) { return b - a; });

    if (acq) motifs.push({ code: "ACQUIESCEMENT", texte: "acquiescement possible" });
    if (!departage) motifs.push({ code: "DEPARTAGE", texte: "familles non départagées" });
    if (cmax < C.SEUIL_COMPAT_MODEREE) motifs.push({ code: "AUCUNE_FAMILLE", texte: "aucune famille au-dessus du seuil de compatibilité modérée" });
    var niveauConf;
    if (completude < C.SEUIL_COMPLETUDE || nonSuff.length >= 3 || acq || cmax < C.SEUIL_COMPAT_MODEREE) niveauConf = "Exploratoire";
    else if (nonSuff.length >= 1 || tensions.length >= 1 || !departage) niveauConf = "Modérément convergent";
    else niveauConf = "Relativement convergent";
    var code = niveauConf === "Relativement convergent" ? "RC" : (niveauConf === "Modérément convergent" ? "MC" : "EX");
    var motifsTxt = motifs.map(function (m) { return m.texte; }).join("; ");
    var T = REF.textes;

    // 7. Dominantes, secondaires, points d'appui, intitulé (R-TIT-01, R-APP-01)
    var cohOf = function (id) { return scores[id].coherence || 0; };
    var bySc = function (a, b) { return scores[b].score - scores[a].score || cohOf(b) - cohOf(a) || dimOrder.indexOf(a) - dimOrder.indexOf(b); };
    var suff = dimOrder.filter(function (id) { return scores[id].confiance === "Suffisante" && scores[id].score !== null; }).sort(bySc);
    var eleveSuff = suff.filter(function (id) { return scores[id].niveau === "Élevé"; });
    var dominantes = eleveSuff.slice(0, C.NB_DIM_DOMINANTES);
    var secondaires = dimOrder.filter(function (id) { return dominantes.indexOf(id) < 0 && scores[id].score !== null && scores[id].score >= C.SEUIL_SECONDAIRE; }).sort(bySc).slice(0, C.NB_DIM_SECONDAIRES);
    dimOrder.forEach(function (id) { scores[id].role = dominantes.indexOf(id) >= 0 ? "dominante" : (secondaires.indexOf(id) >= 0 ? "secondaire" : "autre"); });
    var enTete = suff.length >= 2 ? suff.filter(function (id) { return scores[id].score >= scores[suff[1]].score; }).length : suff.length;
    var titre = (niveauConf === "Exploratoire" || suff.length < 2) ? T["TIT-EX"]
      : T["TIT-STD"].replace("{QUALIF_1}", D[suff[0]].qualif).replace("{QUALIF_2}", D[suff[1]].qualif);
    var appuis = eleveSuff.slice(0, C.NB_POINTS_APPUI).map(function (id) { return { dimension_id: id, libelle: D[id].court, texte: D[id].appui, regle: "R-APP-01" }; });

    // 8. Vigilance de compatibilité (R-VIG-01) + qualité de mesure
    var vigilance = [];
    restituees.forEach(function (f) {
      f.limitants.forEach(function (l) { vigilance.push({ type: "LIMITANT", famille_id: f.famille_id, famille: f.famille, texte: l.texte, regle: "R-VIG-01" }); });
    });
    var qualite = nonSuff.map(function (id) { return { dimension_id: id, nom: D[id].nom, confiance: scores[id].confiance, texte: "Réponses dispersées sur cette dimension : à préciser." }; });

    // 9. Synthèse (R-SYN-01)
    var envRech = environnements.filter(function (e) { return e.lecture === "Recherché"; }).sort(function (a, b) { return b.affinite - a.affinite; }).slice(0, C.NB_ENV_AFFICHES);
    var famNoms = restituees.map(function (f) { return f.famille; }).join(" ; ");
    var blocs = [{ bloc_id: "SYN-INTRO-" + code, nature: "calculé", texte: T["SYN-INTRO-" + code] }];
    if (dominantes.length) blocs.push({ bloc_id: "SYN-DOM", nature: "calculé", texte: T["SYN-DOM"].replace("{DOMINANTES}", dominantes.map(function (id) { return D[id].nom.toLowerCase(); }).join(", ")) });
    if (envRech.length) blocs.push({ bloc_id: "SYN-ENV", nature: "interprété", texte: T["SYN-ENV"].replace("{ENVIRONNEMENTS}", envRech.map(function (e) { return e.caracteristique.toLowerCase(); }).join(", ")) });
    if (cmax < C.SEUIL_COMPAT_MODEREE) blocs.push({ bloc_id: "SYN-FAM-AUCUNE", nature: "hypothèse", texte: T["SYN-FAM-AUCUNE"] });
    else if (!departage) blocs.push({ bloc_id: "SYN-FAM-EXAEQUO", nature: "hypothèse", texte: T["SYN-FAM-EXAEQUO"].replace("{FAMILLES}", famNoms) });
    else blocs.push({ bloc_id: "SYN-FAM", nature: "hypothèse", texte: T["SYN-FAM"].replace("{FAMILLES}", famNoms) });
    blocs.push({ bloc_id: "SYN-LECTURE", nature: "lecture", texte: T["SYN-LECTURE"] });

    var radar = {};
    Object.keys(REF.radar).forEach(function (rid) {
      radar[rid] = REF.radar[rid].map(function (id, i) { return { ordre: i + 1, dimension_id: id, libelle: D[id].court, valeur: scores[id].score, valeur_avant_ajustement: scores[id].score_questionnaire, trace: scores[id].confiance === "Suffisante" ? "plein" : "pointillé" }; });
    });

    return {
      meta: { generated_at: new Date().toISOString(), model_version: REF.meta.model_version, questionnaire_version: REF.meta.questionnaire_version, restitution_version: REF.meta.restitution_version, snapshot_date: REF.meta.snapshot_date, statut_modele: "Prototype non validé empiriquement" },
      profile: { titre: titre, titre_dimensions: suff.slice(0, 2), nb_dim_en_tete: enTete, synthese_blocs: blocs, synthese: blocs.map(function (b) { return b.texte; }).join(" ") },
      dimensions: dimOrder.map(function (id) { return scores[id]; }),
      dominantes: dominantes, secondaires: secondaires,
      radar: radar, environnements: environnements, familles: famTri, familles_restituees: restituees,
      points_appui: appuis, tensions: tensions, vigilance: vigilance, qualite_mesure: qualite,
      confiance: { niveau: niveauConf, code: code, indicateurs: { completude: r2(completude), dim_non_suffisantes: nonSuff.length, tensions: tensions.length, acquiescement: acq, moy_likert_directs: moyDir, moy_likert_inverses: moyInv, ecart_top2: ecart, compatibilite_max: cmax, departage: departage },
        motifs: motifs, texte: T["CONF-" + code].replace("{MOTIFS}", motifsTxt) },
      ajustements: [],
      mentions: { lecture_compat: T["LECT-COMPAT"], donnees: T["MENTION-DONNEES"] }
    };
  }
  return { compute: compute };
})();

</script>
<script>/* Profils FICTIFS du banc d'essai (onglet REPONSES) — Q01→Q51 */
var CT_TESTS = {
  "TEST-001": "5 2 B 2 4 A 3 3 A 4 3 B 2 4 A 2 4 B 2 5 A 3 3 B 2 5 A 5 1 D 4 5 B 5 5 D 4 4 B 3 3 3 4 3 B 5 1 C 4 3 C",
  "TEST-002": "3 3 B 4 3 C 5 2 B 5 2 C 3 3 A 5 1 D 5 2 B 3 4 C 4 3 A 3 3 B 3 2 A 2 2 B 3 4 B 4 5 2 3 4 A 4 2 C 5 5 D",
  "TEST-003": "5 5 B 5 5 D 5 5 B 5 5 D 5 5 B 5 5 D 5 5 B 5 5 D 5 5 B 5 5 D 5 5 B 5 5 D 5 5 B 5 5 5 5 5 B 5 5 D 5 5 D"
};
function ctTestAnswers(id) {
  var v = CT_TESTS[id].split(" "), a = {};
  v.forEach(function (x, i) { a["Q" + String(i + 1).padStart(2, "0")] = x; });
  return a;
}

</script>
<script>
(function () {
  var REF = CT_REF, app = document.getElementById("app");
  var DIM = {}; REF.dimensions.forEach(function (d) { DIM[d[0]] = d; });
  var QS = REF.questions.map(function (q) { return { id: q[0], texte: q[1], bloc: q[2], type: q[3], oblig: q[8] }; });
  var BLOCS = []; QS.forEach(function (q) { if (BLOCS.indexOf(q.bloc) < 0) BLOCS.push(q.bloc); });
  var state = { view: "home", i: 0, answers: {}, open: {}, result: null, example: null, radar: "RAD_FONCT" };

  /* ---------- Sauvegarde sur l'appareil de la personne (rien n'est envoyé) ----------
     Les réponses sont gardées dans le navigateur pour pouvoir reprendre le questionnaire
     ou revenir à son résultat et retélécharger le PDF. Le résultat est recalculé à partir des réponses. */
  var SAVE_KEY = "ct-profil-" + REF.meta.questionnaire_version;
  function loadSaved() { try { var x = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); return x && x.answers ? x : null; } catch (e) { return null; } }
  function saveState() {
    if (state.example) return;
    var n = Object.keys(state.answers).length;
    try {
      if (!n && !Object.keys(state.open).length) return;
      localStorage.setItem(SAVE_KEY, JSON.stringify({ answers: state.answers, open: state.open, i: state.i, done: state.view === "result", t: Date.now() }));
    } catch (e) {}
  }
  function clearSaved() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
  function savedDate(t) { try { return new Date(t).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }); } catch (e) { return ""; } }

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(n) { return n == null ? "—" : String(Math.round(n)); }

  // Sépare l'énoncé et les options « A. … B. … » tels qu'écrits dans le référentiel
  function parseQ(q) {
    if (q.type === "LIKERT5" || q.type === "OUVERTE") return { stem: q.texte, opts: [] };
    var parts = q.texte.split(/\s(?=[A-D]\.\s)/);
    var stem = parts.shift();
    return { stem: stem, opts: parts.map(function (p) { return { key: p[0], label: p.slice(3).trim() }; }) };
  }
  // Ordre d'affichage mélangé (fixe par question) pour les situations : l'ordre A→D encode l'intensité
  function shuffled(arr, seed) {
    var a = arr.slice(), s = 0; for (var k = 0; k < seed.length; k++) s = (s * 31 + seed.charCodeAt(k)) >>> 0;
    for (var i = a.length - 1; i > 0; i--) { s = (s * 1103515245 + 12345) >>> 0; var j = s % (i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  /* ---------- Radar ---------- */
  function radarSVG(axes, opts) {
    opts = opts || {};
    var W = 560, H = 430, cx = W / 2, cy = H / 2 + 2, R = 126, n = axes.length;
    var pt = function (i, v) { var a = -Math.PI / 2 + 2 * Math.PI * i / n; return [cx + Math.cos(a) * R * v / 100, cy + Math.sin(a) * R * v / 100]; };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.label || "Graphique radar") + '">';
    [20, 40, 60, 80, 100].forEach(function (lv) {
      var p = axes.map(function (_, i) { return pt(i, lv).join(","); }).join(" ");
      var strong = lv === 40 || lv === 60;
      s += '<polygon points="' + p + '" fill="none" stroke="var(--line)" stroke-width="' + (strong ? 1.6 : 0.8) + '"' + (strong ? ' stroke-dasharray="4 3"' : '') + '/>';
    });
    axes.forEach(function (_, i) { var e = pt(i, 100); s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + e[0] + '" y2="' + e[1] + '" stroke="var(--line)" stroke-width="0.8"/>'; });
    [40, 60, 100].forEach(function (lv) { var p = pt(0, lv); s += '<text x="' + (p[0] + 5) + '" y="' + (p[1] + 4) + '" font-size="10" fill="var(--muted)" font-family="var(--font-body)">' + lv + '</text>'; });
    var poly = axes.map(function (a, i) { return pt(i, a.valeur || 0).join(","); }).join(" ");
    s += '<polygon points="' + poly + '" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>';
    axes.forEach(function (a, i) {
      var p = pt(i, a.valeur || 0);
      if (a.trace === "plein") s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>';
      else s += '<rect x="' + (p[0] - 5) + '" y="' + (p[1] - 5) + '" width="10" height="10" transform="rotate(45 ' + p[0] + ' ' + p[1] + ')" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>';
      var l = pt(i, 116), anchor = Math.abs(l[0] - cx) < 8 ? "middle" : (l[0] > cx ? "start" : "end");
      var words = String(a.libelle).split(" "), l1 = words.length > 1 ? words[0] : a.libelle, l2 = words.length > 1 ? words.slice(1).join(" ") + " " : "";
      var top = l[1] < cy - R * 0.9, bottom = l[1] > cy + R * 0.9;
      var y0 = top ? l[1] - 22 : (bottom ? l[1] + 14 : l[1] - 6);
      s += '<text x="' + l[0] + '" y="' + y0 + '" text-anchor="' + anchor + '" font-size="15" fill="var(--ink)" font-family="var(--font-body)">' +
        '<tspan x="' + l[0] + '">' + esc(l1) + (l2 ? '' : ' ') + (l2 ? '' : '<tspan font-weight="700" fill="var(--accent-ink)">' + fmt(a.valeur) + '</tspan>') + '</tspan>' +
        (l2 ? '<tspan x="' + l[0] + '" dy="17">' + esc(l2) + '<tspan font-weight="700" fill="var(--accent-ink)">' + fmt(a.valeur) + '</tspan></tspan>' : '<tspan x="' + l[0] + '" dy="17"> </tspan>') + '</text>';
    });
    return s + "</svg>";
  }

  /* ---------- Accueil ---------- */
  function renderHome() {
    var ex = CT_ENGINE.compute(REF, ctTestAnswers("TEST-001"));
    var sv = loadSaved(), resume = "";
    if (sv) resume = '<div class="notice stack" style="gap:10px;border-color:var(--accent)"><h3>' + (sv.done ? "Votre dernier résultat est gardé sur cet appareil" : "Vous aviez commencé le questionnaire") + '</h3>' +
      '<p class="small">' + (sv.done ? "Questionnaire terminé le " + esc(savedDate(sv.t)) + ". Vous pouvez revoir votre profil et télécharger le PDF sans tout refaire." : "Vous en étiez à la question " + (sv.i + 1) + " sur " + QS.length + " (" + esc(savedDate(sv.t)) + ").") + '</p>' +
      '<div class="row"><button class="btn" id="resume">' + (sv.done ? "Revoir mon résultat" : "Reprendre où j'en étais") + '</button><button class="btn ghost" id="forget">Effacer et recommencer</button></div></div>';
    app.innerHTML =
      '<div class="stack" style="gap:30px">' + resume +
      '<div class="hero"><div class="stack" style="gap:18px">' +
      '<span class="eyebrow">' + esc(CT_SITE.organisation) + ' · Exploration professionnelle</span>' +
      '<h1>Profil professionnel</h1>' +
      '<p style="font-size:1.12rem">Répondez à une cinquantaine de questions sur votre manière de travailler. Vous obtiendrez une lecture de vos préférences, des environnements de travail qui vous correspondent et des familles de métiers à explorer.</p>' +
      '<div class="row"><button class="btn" id="start">Commencer le questionnaire</button><button class="btn ghost" id="example">Voir un exemple de résultat</button></div>' +
      '</div><figure class="example-fig" style="margin:0">' + radarSVG(ex.radar.RAD_FONCT, { label: "Exemple de radar pour un profil fictif" }) +
      '<figcaption>Exemple : profil fictif « analytique et rigoureux »</figcaption></figure></div>' +
      '<ul class="facts"><li><b>12 à 15 min</b>53 questions en 6 parties</li><li><b>Rien n\'est envoyé</b>Vos réponses restent sur votre appareil, vous pouvez y revenir</li><li><b>Un rapport PDF</b>À télécharger à la fin</li></ul>' +
      '<div class="notice stack" style="gap:8px"><h3>Trouvez l\'environnement où vous donnez le meilleur</h3>' +
      '<p class="small">Ce questionnaire vous aide à savoir dans quel environnement vous aimez travailler, et où vos talents s\'expriment le mieux. Il n\'y a pas de bonne ou de mauvaise réponse : répondez simplement selon ce qui vous ressemble aujourd\'hui. Aucune information personnelle n\'est demandée.</p></div>' +
      '</div>';
    document.getElementById("start").onclick = function () { if (loadSaved()) { clearSaved(); state.answers = {}; state.open = {}; } state.view = "quiz"; state.i = 0; render(); };
    var rb = document.getElementById("resume");
    if (rb) rb.onclick = function () { var x = loadSaved(); if (!x) return; state.answers = x.answers || {}; state.open = x.open || {}; state.example = null;
      if (x.done) { state.result = CT_ENGINE.compute(REF, state.answers); state.view = "result"; } else { state.i = Math.min(x.i || 0, QS.length - 1); state.view = "quiz"; }
      render(); scrollTop(); };
    var fb = document.getElementById("forget");
    if (fb) fb.onclick = function () { clearSaved(); state.answers = {}; state.open = {}; state.i = 0; state.view = "home"; render(); };
    document.getElementById("example").onclick = function () { showExample("TEST-001"); };
  }

  /* ---------- Questionnaire ---------- */
  function renderQuiz() {
    var q = QS[state.i], P = parseQ(q), bi = BLOCS.indexOf(q.bloc);
    var segs = BLOCS.map(function (b) {
      var inB = QS.filter(function (x) { return x.bloc === b; }), done = inB.filter(function (x) { return QS.indexOf(x) < state.i; }).length;
      return '<div class="seg"><i style="width:' + Math.round(100 * done / inB.length) + '%"></i></div>';
    }).join("");
    var cur = state.answers[q.id], body = "";
    if (q.type === "LIKERT5") {
      body = '<div class="opts likert" role="group" aria-label="Votre réponse">' + REF.likertLabels.map(function (l, k) {
        var v = String(k + 1); return '<button class="opt" data-v="' + v + '" aria-pressed="' + (cur === v) + '"><span class="key">' + v + '</span><span>' + esc(l) + '</span></button>';
      }).join("") + '</div>';
    } else if (q.type === "OUVERTE") {
      body = '<label class="small muted" for="free">Facultatif. Cette réponse n\'est pas utilisée dans le calcul et n\'est envoyée nulle part ; elle apparaîtra seulement dans votre rapport.</label>' +
        '<textarea id="free" maxlength="1200">' + esc(state.open[q.id] || "") + '</textarea>';
    } else {
      var opts = q.type === "SITUATION4" ? shuffled(P.opts, q.id) : P.opts;
      body = '<div class="opts" role="group" aria-label="Votre réponse">' + opts.map(function (o, k) {
        return '<button class="opt" data-v="' + o.key + '" aria-pressed="' + (cur === o.key) + '"><span class="key">' + (k + 1) + '</span><span>' + esc(o.label) + '</span></button>';
      }).join("") + '</div>';
    }
    var hint = q.type === "LIKERT5" ? "Dans quelle mesure êtes-vous d'accord ?" : (q.type === "CHOIX_FORCE" ? "Choisissez l'option la plus proche de vous, même si aucune n'est parfaite." : (q.type === "SITUATION4" ? "Choisissez la réaction qui vous ressemble le plus. Toutes sont acceptables." : "Question ouverte"));
    app.innerHTML =
      '<div class="stack" style="gap:22px"><div class="progress"><div class="row" style="justify-content:space-between"><span class="eyebrow">' + esc(q.bloc.replace(/^B\d – /, "")) + '</span>' +
      '<span class="small muted">Question ' + (state.i + 1) + ' sur ' + QS.length + '</span></div><div class="segs" aria-hidden="true">' + segs + '</div></div>' +
      '<div class="qcard"><p class="small muted">' + hint + '</p><p class="qtext" id="qt" tabindex="-1">' + esc(P.stem) + '</p>' + body + '</div>' +
      '<div class="qnav"><button class="btn ghost" id="prev">' + (state.i === 0 ? "Retour à l'accueil" : "Question précédente") + '</button>' +
      (q.type === "OUVERTE" ? '<button class="btn" id="next">' + (state.i === QS.length - 1 ? "Voir mon profil" : "Continuer") + '</button>' :
        (cur ? '<button class="btn" id="next">Question suivante</button>' : '')) + '</div></div>';
    app.querySelectorAll(".opt").forEach(function (b) {
      b.onclick = function () { state.answers[q.id] = b.dataset.v; app.querySelectorAll(".opt").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); setTimeout(next, 220); };
    });
    var ta = document.getElementById("free"); if (ta) ta.oninput = function () { state.open[q.id] = ta.value; saveState(); };
    document.getElementById("prev").onclick = function () { if (state.i === 0) { state.view = "home"; } else state.i--; render(); };
    var nb = document.getElementById("next"); if (nb) nb.onclick = next;
    var qt = document.getElementById("qt"); if (state.focus && qt) qt.focus({ preventScroll: true });
    state.focus = true;
  }
  function next() {
    if (state.i < QS.length - 1) { state.i++; render(); scrollTop(); }
    else finish();
  }
  function finish() {
    app.innerHTML = '<div class="loading"><div class="stack" style="align-items:center"><span class="eyebrow">Calcul en cours</span><h2>Nous préparons votre profil</h2></div></div>';
    setTimeout(function () { state.result = CT_ENGINE.compute(REF, state.answers); state.example = null; state.view = "result"; render(); scrollTop(); }, 500);
  }
  function showExample(id) { state.result = CT_ENGINE.compute(REF, ctTestAnswers(id)); state.example = id; state.view = "result"; render(); scrollTop(); }
  function scrollTop() { try { window.scrollTo(0, 0); } catch (e) {} }
  document.addEventListener("keydown", function (e) {
    if (state.view !== "quiz" || e.target.tagName === "TEXTAREA") return;
    var n = parseInt(e.key, 10), btns = app.querySelectorAll(".opt");
    if (n >= 1 && n <= btns.length) btns[n - 1].click();
  });

  /* ---------- Restitution ---------- */
  function bipolar(name, val, pb, ph, lim, extra) {
    return '<div class="bipolar"><div class="name"><span>' + esc(name) + '</span><span class="score">' + fmt(val) + (extra || "") + '</span></div>' +
      '<span class="pl">' + esc(pb) + '</span><div class="track" role="img" aria-label="' + esc(name) + ' : ' + fmt(val) + ' sur 100"><span class="mark40"></span><span class="mark60"></span>' +
      '<span class="dot' + (lim ? " lim" : "") + '" style="left:' + (val || 0) + '%"></span></div><span class="pr">' + esc(ph) + '</span></div>';
  }
  function qShort(id) { var q = QS.filter(function (x) { return x.id === id; })[0]; return parseQ(q).stem; }
  function ansLabel(id, v) {
    var q = QS.filter(function (x) { return x.id === id; })[0];
    if (q.type === "LIKERT5") return REF.likertLabels[Number(v) - 1];
    var o = parseQ(q).opts.filter(function (x) { return x.key === v; })[0]; return o ? o.label : v;
  }

  function renderResult() {
    var r = state.result, c = r.confiance;
    var byId = {}; r.dimensions.forEach(function (d) { byId[d.dimension_id] = d; });
    var html = '<div class="report">';
    if (state.example) html += '<div class="notice small"><b>Exemple à partir d\'un profil fictif</b> (' + esc(state.example) + '). Ces réponses ont été construites pour tester l\'outil. ' +

    html += '<header class="rhead"><span class="eyebrow">Votre profil professionnel</span><h1>' + esc(r.profile.titre) + '</h1>' +

      txt("Exemples de métiers : " + f.exemples_metiers, 9.5, "normal", INK, 0.5);
      txt("Réalités du métier : " + f.contraintes, 9.5, "normal", MUT, 0.5);
      txt("Pour explorer : " + f.pistes, 9.5, "normal", MUT, 3);
    });

    h2("Points d'appui");
    if (r.points_appui.length) r.points_appui.forEach(function (a) { txt("• " + a.texte, 9.5, "normal", INK, 1.5); }); else txt("Aucun point d'appui ne ressort nettement.", 9.5, "italic", MUT);
    h2("Tensions et points de vigilance");
    r.tensions.forEach(function (t) { txt("• " + t.message, 9.5, "normal", INK, 0.5); if (t.question_adaptative) txt("Pour y réfléchir : " + t.question_adaptative, 9, "italic", MUT, 2); });
    r.vigilance.forEach(function (v) { txt("• " + v.famille + " : " + v.texte, 9.5, "normal", INK, 1.5); });
    if (!r.tensions.length && !r.vigilance.length) txt("Aucune tension ni point de vigilance détecté.", 9.5, "italic", MUT);

    h2("Niveau de confiance : " + r.confiance.niveau);
    txt(r.confiance.texte, 10, "normal", INK, 2);
    var I = r.confiance.indicateurs;
    txt("Questions répondues : " + Math.round(I.completude * 100) + " % · dimensions à réponses dispersées : " + I.dim_non_suffisantes + " · tensions : " + I.tensions + " · écart entre les 2 premières familles : " + I.ecart_top2 + " pts", 9, "normal", MUT, 2);

    var openIds = ["Q52", "Q53"].filter(function (id) { return (state.open[id] || "").trim(); });
    if (openIds.length) { h2("Vos notes (non utilisées dans le calcul)"); openIds.forEach(function (id) { txt(qShort(id), 9, "italic", MUT, 0.5); txt(state.open[id], 9.5, "normal", INK, 2.5); }); }

    h2("Méthode");
    txt("Questionnaire d'orientation Couleur Talents. Il décrit vos préférences de travail et les environnements où vous êtes le plus à l'aise. Les scores (0 à 100) situent vos réponses dans l'échelle du questionnaire ; les familles de métiers sont des pistes à explorer avec Couleur Talents.", 9, "normal", MUT, 2);
    txt(r.mentions.donnees, 9, "normal", MUT, 2);
    h2("Pour aller plus loin avec " + CT_SITE.organisation);
    txt("Un échange avec un·e conseiller·ère permet de confronter ces résultats à votre parcours et d'identifier les formations ou accompagnements utiles.", 9.5, "normal", INK, 1.5);
    if (CT_SITE.contactUrl) txt("Contact : " + CT_SITE.contactUrl, 9.5, "normal", ACC, 0.5);
    (CT_SITE.liens || []).forEach(function (l) { txt(l.label + " : " + l.url, 9, "normal", MUT, 0.5); });
    if (CT_SITE.coordonnees) txt(CT_SITE.coordonnees, 9, "normal", MUT, 2);
    txt("Référence Couleur Talents : C. Navarro, Le sens de votre projet professionnel : outil pédagogique d'accompagnement à l'orientation et à l'évolution professionnelle, 2026, https://doi.org/10.5281/zenodo.20557802.", 8.5, "normal", MUT, 1);
    txt("Inspiré de LOGIQ+ (A. Povie, 2025), https://doi.org/10.5281/zenodo.17782246, licence CC BY 4.0.", 8.5, "normal", MUT, 1);
    txt("Modèle " + r.meta.model_version + " · questionnaire " + r.meta.questionnaire_version + " · restitution " + r.meta.restitution_version + " · référentiel du " + r.meta.snapshot_date, 8, "normal", MUT, 0);
    var pages = doc.getNumberOfPages();
    for (var pg = 1; pg <= pages; pg++) { doc.setPage(pg); doc.setFontSize(7.5); doc.setTextColor.apply(doc, MUT); doc.text("Profil professionnel Couleur Talents · " + pg + "/" + pages, 210 - M, 290, { align: "right" }); }
    var fname = "profil-professionnel-couleur-talents.pdf";
    deliverPDF(doc, fname);
  }
  // Téléchargement : sur le site, téléchargement direct ; dans l'aperçu claude.ai, passage par la fenêtre de confirmation de la plateforme
  function pdfStatus(msg) { var el = document.getElementById("pdfmsg"); if (el) el.textContent = msg; }
  function deliverPDF(doc, fname) {
    var tryUse = window.claude && typeof window.claude.use === "function";
    if (!tryUse) { doc.save(fname); pdfStatus("Rapport téléchargé. Vérifiez votre dossier Téléchargements."); return; }
    pdfStatus("Préparation du téléchargement…");
    Promise.resolve(DL || window.claude.use("downloads")).then(function (dl) {
      if (!dl) { doc.save(fname); pdfStatus("Si rien ne s'est passé, ce mode d'aperçu bloque les téléchargements : le PDF fonctionnera une fois l'outil installé sur le site."); return; }
      return dl.save({ filename: fname, data: doc.output("blob") }).then(function () { pdfStatus("Rapport téléchargé."); }, function (e) {
        pdfStatus(e && e.code === "declined" ? "Téléchargement annulé." : "Le téléchargement n'a pas pu se faire ici (" + (e && e.code || "erreur") + ").");
      });
    });
  }

  var DL = null;
  try { if (window.claude && typeof window.claude.use === "function") window.claude.use("downloads").then(function (d) { DL = d; }, function () {}); } catch (e) {}

  function render() {
    if (state.view === "home") renderHome(); else if (state.view === "quiz") renderQuiz(); else renderResult();
    saveState();
  }
  render();

  // Hauteur transmise à la page parente pour ajuster l'iframe automatiquement
  function postHeight() { try { if (window.parent !== window) window.parent.postMessage({ type: "ct-profil-height", height: document.documentElement.scrollHeight }, "*"); } catch (e) {} }
  if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body); else setInterval(postHeight, 800);
})();
</script>
